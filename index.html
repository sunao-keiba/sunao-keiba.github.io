<!doctype html>
<html lang="ja">
<head>

<style>
:root{--ink:#111;--mute:#666;--soft:#999;--bg:#fff;--bg2:#fcfbf8;--line:#e3e3df;--ac:#6b4f2a;--ac2:#f1ebe2;--ac3:#e9e0d2;--y:#fdf6e1;}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg2)}
body{background:var(--bg2);color:var(--ink);font-family:'M PLUS Rounded 1c','Zen Maru Gothic','Hiragino Maru Gothic ProN',Meiryo,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
svg.ic{width:100%;height:100%;fill:none;stroke:#111;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 110px;min-height:100vh}
/* header */
.hd{display:flex;align-items:center;justify-content:space-between;min-height:40px}

.hd .wm>div{text-align:center}

.hd .wm small.en{display:block;font-family:'Outfit',sans-serif;letter-spacing:.3em;font-weight:700;font-size:9.5px;color:var(--mute);margin-top:4px;white-space:nowrap;text-align:center}
.hd .dt{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:11px;color:var(--mute);text-align:right;line-height:1.4}

.hdr{display:flex;align-items:center;gap:10px}
.thm{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;padding:0;background:transparent}.thm svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lead{font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.6;word-break:auto-phrase}
section{display:none}section.on{display:block}
h2{font-size:22px;font-weight:800;letter-spacing:.02em;margin-top:14px;display:flex;align-items:center;gap:8px}
h2 i{width:24px;height:24px;display:block}
h3{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:10px;letter-spacing:.24em;color:var(--mute);font-weight:400;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}

.seg button.on{background:var(--ink);color:#fff}

.note{font-size:10.5px;color:var(--soft);line-height:1.8;margin-top:8px;letter-spacing:.04em;word-break:auto-phrase}
.foot{font-size:10px;color:var(--soft);line-height:1.7;margin-top:24px;text-align:center}
.box{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;margin-top:12px}
.box p{font-size:12px;color:var(--mute);line-height:1.7;word-break:auto-phrase}
.box b{font-size:13px}
/* 枠の丸 */
.cap{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-weight:400;font-size:11.5px;box-shadow:inset 0 0 0 1px #111;letter-spacing:0;line-height:1;text-indent:0}
/* レース目次 案13: タイムライン＋大きな数字、塗りなし */
.lxh{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 6px}

.lxt{display:grid;column-gap:8px;row-gap:0;align-items:stretch;margin-top:2px}
.lxt-vh{position:relative;font-size:11.5px;font-weight:800;text-align:left;padding:0 0 0 15px;margin-bottom:9px;display:flex;gap:5px;align-items:baseline;white-space:nowrap;overflow:hidden}
.lxt-vh span{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:9.5px;color:var(--mute);font-weight:400}
.lxt-vh::after{content:"";position:absolute;left:15px;right:0;bottom:-5px;height:1.5px;border-radius:1px;background:var(--ac)}
.lxt-q{position:relative;display:block;width:100%;text-align:left;border:none;background:none;border-radius:0;padding:3px 2px 6px 15px;min-width:0;color:#333}
.lxt-q.empty{padding:0}
.lxt-q::before{content:"";position:absolute;left:3.5px;top:0;bottom:0;width:1.5px;background:#d6d5cf}
.lxt-q.first::before{top:11px}
.lxt-q.last::before{bottom:auto;height:11px}
.lxt-q.empty::before,.lxt-q.empty::after{display:none}
.lxt-q::after{content:"";position:absolute;left:.5px;top:7.5px;width:7px;height:7px;border-radius:50%;background:#fff;border:1.5px solid #9a9a96}
.lxt-q.fin::after{background:#9a9a96}
.lxt-q.dis::after{border-color:#c4c4c0}
.lxt-q.nx::after{border-color:var(--ac);background:var(--ac);box-shadow:0 0 0 1.5px #fff,0 0 0 3px var(--ac)}
.lxt-q .h{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.lxt-q .h b{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:17px;font-weight:400;line-height:1;letter-spacing:-.02em}
.lxt-q .h i{font-style:normal;font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:8.5px;color:var(--mute)}
.lxt-q .h em{font-style:normal;font-size:8.5px;font-weight:800;color:#aaa}
.lxt-q .n{display:block;font-size:9px;font-weight:700;color:#777;line-height:1.25;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lxt-q .w{display:block;font-size:8px;line-height:1.3;color:var(--ac);font-weight:800}
.lxt-q.fin{color:#b5b5b0}
.lxt-q.fin .h b{color:#c4c4c0}
.lxt-q.fin .n{color:#b5b5b0}
.lxt-q.fin .h em{color:#ccc}
.lxt-q.dis{color:#c4c4c0;cursor:default}
.lxt-q.dis .n{color:#c4c4c0}
.lxt-q.nx .h b{color:var(--ac);font-weight:500}
.lxt-q.nx .n{color:var(--ac);font-weight:800}
.lxt-q .g{position:absolute;right:2px;top:9px;width:6px;height:6px;border-radius:50%;background:#c9a227}
.lxt-lg{display:flex;gap:12px;font-size:9.5px;color:var(--mute);margin-top:10px;align-items:center;white-space:nowrap}
.lxt-lg i{display:inline-block;vertical-align:-1px;margin-right:4px}
.lxt-lg i.d{width:7px;height:7px;border-radius:50%;border:1.5px solid #9a9a96;background:#9a9a96}
.lxt-lg i.d.x{border-color:var(--ac);background:var(--ac);box-shadow:0 0 0 1.5px #fff,0 0 0 3px var(--ac);margin-left:3px;margin-right:7px}
.lxt-lg i.g{width:6px;height:6px;border-radius:50%;background:#c9a227}
/* レース上部の切替（貼り付き） */
#rsel{display:block;position:sticky;top:0;z-index:21;background:var(--bg2);margin:4px -14px 0;padding:6px 14px 8px}
#rsel.stuck{box-shadow:0 1px 0 var(--line)}
/* レース見出し */
.rh2{text-align:left;margin-top:12px}
.rh2 .rh-n{font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-weight:800;line-height:1.35;letter-spacing:.02em;color:#111;font-size:17px;word-break:auto-phrase}
.rh2 .rh-n em{font-style:normal;font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:11px;font-weight:500;color:#fff;background:var(--ac);border-radius:4px;padding:1px 6px;margin-right:8px;vertical-align:3px}
.rh2 .rh-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.rh2 .rh-m span{display:inline-block;margin:0;font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:11.5px;font-weight:700;color:#444;background:#f3f3ef;border-radius:999px;padding:3px 11px;white-space:nowrap}
.rh2 .rh-m span.sf{background:var(--ac2);color:var(--ac)}
.rh2 .rh-m span.yoso{background:#fff;box-shadow:inset 0 0 0 1px #d9b85a;color:#5a4000}
.fxl{display:flex;align-items:flex-start;gap:6px;margin-top:8px;font-size:10.5px;line-height:1.55;color:var(--mute);letter-spacing:.02em;word-break:auto-phrase}
/* 出馬表 */
.tt{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:8px}
.tt b{font-size:13px;font-weight:800}
.seg.srt{width:132px;flex:none}
.t{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;margin-top:8px}
.t th{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:9.5px;color:var(--mute);font-weight:400;text-align:right;padding:6px 4px;border-bottom:1.5px solid var(--ink);white-space:nowrap;letter-spacing:.06em}
.t td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
.t th.l,.t td.l{text-align:left}
.t td.c{text-align:center;padding-left:0;padding-right:2px;width:26px}
.t td.nm{font-weight:700;line-height:1.15;max-width:0;width:44%;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.t td.nm .hn{display:flex;align-items:center;gap:4px;min-width:0}
.t td.nm .hn span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.t td.nm small{display:block;margin:2px 0 0;color:var(--soft);font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:9.5px;font-weight:400;overflow:hidden;text-overflow:ellipsis}
.t td.nm small b{font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-weight:500;color:var(--mute)}
.t tr.e2 td{background:#f5e19e}
.t tr.e2 td.ev{font-weight:700;color:#3a2a00}
.t tr.e1 td.ev{font-weight:700;color:#b39a52}
.t tr.scr td{opacity:.45}
.t tr.scr td.nm .hn span{text-decoration:line-through}
.t tr[data-h]{cursor:pointer}
.t tr.hit td{background:#e1f5ee}
.t tr.e2.hit td{background:#dff0d0}
.t td.ev{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:13px}
.t td.p{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif}
.t td.od,.t td.pp{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;color:#444}
.sw{display:inline-flex;align-items:center;justify-content:center;flex:none;width:14px;height:14px;border-radius:50%;background:var(--ac2);color:var(--ac);font-size:8px;font-weight:800;line-height:1}
.al{display:inline-flex;align-items:center;flex:none;font-size:8.5px;font-weight:800;line-height:1;padding:2px 5px;border-radius:999px;background:#fff;color:#8a5a00;box-shadow:inset 0 0 0 1px #d9b85a;white-space:nowrap}
.al.a2{background:#f3d9a6;color:#5a3a00;box-shadow:none}
/* 近5走・注意の開き */
.hcard{display:none}
.hcard td{padding:0 0 10px;text-align:left;white-space:normal;background:#fff}
.hc{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fcfbf8}
.hc h4{font-size:10.5px;font-weight:800;color:var(--ac);letter-spacing:.06em;margin:4px 0 4px}
.pt{width:100%;border-collapse:collapse;font-size:10.5px}
.pt th{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:8.5px;color:var(--mute);font-weight:400;text-align:right;padding:2px 3px;border-bottom:1px solid var(--line);white-space:nowrap}
.pt td{padding:4px 3px;text-align:right;white-space:nowrap;border-bottom:1px solid #f0efe9;font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:10.5px}
.pt th.l,.pt td.l{text-align:left}
.pt td.l{font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif}
.pt td b{font-weight:500}
.pt td.w1{color:#8a5a00;font-weight:700}
.fv{display:grid;gap:5px;margin-top:4px}
.fv div{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;font-size:11px}
.fv div b{font-size:10.5px;font-weight:700;color:var(--mute)}
.fv div span{font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:11px}
.fv div span em{font-style:normal;color:#8a5a00;font-weight:700}
.fv div span.ok em{color:#1f7a4d}
.fv p{font-size:10.5px;color:var(--mute);margin-top:6px;line-height:1.6;word-break:auto-phrase}
/* 結果 */
.res{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;margin-top:12px}
.res .ro{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.res .ro div{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;white-space:nowrap}
.res .ro div i{font-style:normal;font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:10px;color:var(--mute);font-weight:400}
.res .ro div small{font-size:9.5px;color:var(--soft);font-weight:400}
.pay{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px}
.pay td{padding:4px 2px;border-bottom:1px solid #f0efe9;white-space:nowrap}
.pay td:first-child{color:var(--mute);font-size:10.5px;width:44px}
.pay td:nth-child(2){font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif}
.pay td:last-child{text-align:right;font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-weight:500}
.pay td:last-child small{color:var(--soft);font-weight:400;margin-left:4px}
.pay tr.g td:last-child{color:#8a5a00;font-weight:700}
/* 使い方 */
.hto .qs{display:grid;gap:8px;margin-top:12px}.hto .qs div{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--ac);color:#fff}.hto .qs b{flex:none;width:22px;height:22px;border-radius:50%;background:#f5e19e;color:var(--ac);font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}.hto .qs span{font-size:12px;line-height:1.6;letter-spacing:.02em;word-break:auto-phrase}.hto .qs em{font-style:normal;color:#f5e19e;font-weight:700}
.hto .hs{margin-top:22px}.hto .hs>div:first-child{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}.hto .hs>div:first-child i{width:22px;height:22px;flex:none;color:var(--ac)}.hto .hs>div:first-child b{font-size:14.5px;font-weight:700;letter-spacing:.04em}
.hto ul{list-style:none;margin:8px 0 0;padding:0}.hto li{position:relative;padding:6px 0 6px 14px;font-size:12px;line-height:1.7;color:var(--ink);letter-spacing:.02em;word-break:auto-phrase}.hto li:before{content:'';position:absolute;left:2px;top:14px;width:5px;height:5px;border-radius:50%;background:#c9a227}
.hto li b{font-weight:700}.hto .k{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin:0 2px;letter-spacing:.02em;white-space:nowrap}.hto .k.g{background:#f5e19e;color:#3a2a00}.hto .k.g2{background:#fefaf0;color:#5a4000;box-shadow:inset 0 0 0 1px #d9b85a}.hto .k.n{background:var(--ac);color:#fff}
/* 下のカプセル（2段） */
.nav{position:fixed;left:0;right:0;bottom:14px;margin:0 auto;width:min(calc(100% - 24px),440px);background:#fff;border-radius:20px;box-shadow:0 2px 6px rgba(60,45,20,.10),0 10px 26px rgba(60,45,20,.20);z-index:30;transition:transform .28s ease,opacity .28s ease}
.nav.hid{transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none}
.nav .in{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 4px;padding:4px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:8.5px;font-weight:700;color:rgba(107,79,42,.6);min-width:0;padding:4px 0 3px;border-radius:14px;white-space:nowrap;line-height:1.3}
.nav button i{width:20px;height:20px;display:block}
.nav button svg{stroke:rgba(107,79,42,.6)}
.nav button.on{background:var(--ac2);color:var(--ac)}
.nav button.on svg{stroke:var(--ac);stroke-width:1.9}
.nav button[data-k="record"] svg{stroke-width:3}.nav button.on[data-k="record"] svg{stroke-width:3.5}
.nav .nup,.nav .nls{display:none}
.nav.rc .in{grid-template-columns:repeat(2,minmax(0,1fr)) 54px 54px}
.nav.rc .nls{display:flex;grid-column:3;grid-row:1 / span 2;justify-content:center}
.nav.rc .nup{display:flex;grid-column:4;grid-row:1 / span 2;justify-content:center}
.pend{font-size:12px;color:var(--mute);padding:20px 0;text-align:center}

/* レース切替（UMAMI の帯と同じ部品。2026-10-30） */
.rs-a{display:flex;align-items:center;gap:8px;min-width:0}
.rs-v{display:flex;border:1.5px solid #9a9a9a;border-radius:999px;overflow:hidden;flex:none;background:#fff}
#rsel .rs-v button{padding:4px 10px;font-size:11.5px;font-weight:700;color:#555;white-space:nowrap;line-height:1.35}
#rsel .rs-v button+button{border-left:1px solid #e2e2dc}
#rsel .rs-v button.vo{background:var(--ac);color:#fff}#rsel .rs-v button.cur:not(.vo){color:var(--ac)}
.rs-n{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:flex-end;gap:5px}
.rs-n b{font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rs-n i{font-style:normal;font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;font-size:10px;color:var(--mute);flex:none}
#rsel .rs-r{display:flex;gap:0;overflow:hidden;border:1.5px solid #9a9a9a;border-radius:13px;background:#fff;padding:2px;margin-top:7px;position:relative}
#rsel .rs-r button{flex:1 1 0;min-width:0;height:38px;position:relative;border-radius:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0 0 4px;font-family:'DM Mono','M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;color:#444;line-height:1}
#rsel .rs-r button+button{border-left:1px solid #ecece6}
#rsel .rs-r button b{font-size:12px;font-weight:400}
#rsel .rs-r button small{font-size:7.5px;color:#8a8a86;letter-spacing:-.02em;white-space:nowrap}
#rsel .rs-r button::after{content:"";position:absolute;left:28%;right:28%;bottom:3px;height:2px;border-radius:1px;background:#e8cc78}
#rsel .rs-r button.turf::after{background:#cfd3e2}
#rsel .rs-r button.gone b,#rsel .rs-r button.gone small{color:#b0b0ac}
#rsel .rs-r button:disabled b,#rsel .rs-r button:disabled small{color:#d0d0cc}#rsel .rs-r button:disabled::after{display:none}
#rsel .rs-r button.nx{box-shadow:inset 0 0 0 1.5px var(--ac)}

  <div class="foot">正式な情報は各主催者の公式発表でご確認ください。</div>
</div>

  <button data-k="races"><i><svg class="ic"><use href="#i-flag"/></svg></i>レース</button>
  <button data-k="record"><i><svg class="ic"><use href="#i-chart"/></svg></i>記録</button>
  <button data-k="howto"><i><svg class="ic"><use href="#i-book"/></svg></i>使い方</button>
  <button data-k="mem"><i><svg class="ic"><use href="#i-user"/></svg></i>会員</button>

  <button data-k="up" class="nup" type="button" aria-label="いちばん上へ"><i><svg class="ic"><use href="#i-up2"/></svg></i>上へ</button>
</div></div>
<script>
const DAYS=["20261030", "20261029"];            /* ある日付（新しい順） */
const BUILT='2026-10-30T0856';
const GATED=true;        /* 合い言葉あり（1日券） */
const NOTE_URL="";      /* noteの1日券の記事一覧（空なら案内だけ） */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico=(n,cls)=>`<i class="${cls||''}"><svg class="ic"><use href="#i-${n}"/></svg></i>`;
const ls={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const WBG={1:'#ffffff',2:'#2b2b2b',3:'#e5342b',4:'#2f6fd0',5:'#f2cf1b',6:'#38a05a',7:'#f0870f',8:'#f0a2bd'};
const WFG={1:'#111',2:'#fff',3:'#fff',4:'#fff',5:'#111',6:'#fff',7:'#fff',8:'#111'};
const cap=h=>`<span class="cap" style="background:${WBG[h.waku]||'#ddd'};color:${WFG[h.waku]||'#111'}">${h.uno}</span>`;
const WDJ='日月火水木金土', dayLab=d=>`${+d.slice(4,6)}/${+d.slice(6,8)}（${WDJ[new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8)).getDay()]}）`;
function ymd(d){ return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
function isDark(){ return document.documentElement.getAttribute('data-theme')==='dark'; }
function thmBtn(){ return `<button class="thm" type="button" onclick="toggleTheme()" aria-label="${isDark()?'明るい画面にする':'暗い画面にする'}"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-${isDark()?'sun':'moon'}"/></svg></button>`; }
function toggleTheme(){ const dk=!isDark(); if(dk) document.documentElement.setAttribute('data-theme','dark'); else document.documentElement.removeAttribute('data-theme'); try{localStorage.setItem('sunao_theme',dk?'dark':'light');}catch(e){} renderHeader(); }
let DAY=null, DATA=null, byRid={}, VENUES=[], cur={race:null}, tab='races', SORT='uno';
const CACHE={};
function pickDay(){ const q=new URLSearchParams(location.search).get('d'); if(q&&DAYS.includes(q)) return q; const t=ymd(new Date()); if(DAYS.includes(t)) return t; const fut=DAYS.filter(d=>d>t).sort(); return fut[0]||DAYS[0]; }
async function loadDay(d){ if(CACHE[d]) return CACHE[d]; const r=await fetch(`data/${d}.json?v=${BUILT}`); const j=await r.json(); CACHE[d]=j; return j; }
async function setDay(d){ DAY=d; DATA=await loadDay(d); mergePaid(DATA,d); byRid={}; (DATA.races||[]).forEach(r=>{ byRid[r.rid]=r; (r.runners||[]).forEach(h=>h._rid=r.rid); });
  VENUES=[...new Set((DATA.races||[]).map(r=>r.venue_name))]; }
const PR=h=>h.scr?0:(h.p==null?null:h.p);
function renderHeader(){ const d=DAY||'', ds=d?`${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}`:'';
  $('#hd').innerHTML=`<div class="wm"><div><span class="kana">すなお</span><small class="en">SUNAO</small></div></div><div class="hdr"><div class="dt">${ds}<b>${DATA&&DATA.built?'更新 '+esc(DATA.built.slice(11)):''}</b></div>${thmBtn()}</div>`; }
function showTab(k){ if(!document.getElementById('s-'+k)) k='races'; tab=k; document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+k));
  document.querySelectorAll('.nav button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===(k==='race'?'races':k))); $('.nav').classList.toggle('rc',k==='race'); if(k!=='race') ls.set('sunao_tab',k); window.scrollTo(0,0); }

/* ===== 合い言葉（2026-10-30） ===== */
const LSK='sunao_pw';            /* この端末で覚えている合い言葉（配列） */
let ENC=null, OPEN={};           /* ENC: data/enc.json（鍵のかかった日）、OPEN: 開いた日 → {rid:{uno:{p,ev,mkt,fav,alert}}} */
function b64d(s){const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function kekOf(pw){ const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(ENC.salt),iterations:ENC.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']); }
const dec=(k,iv,ct)=>crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(iv)},k,b64d(ct));
async function unz(buf,z){ if(!z) return new TextDecoder().decode(buf);
  if(typeof DecompressionStream!=='undefined'){ const st=new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip')); return await new Response(st).text(); }
  if(!window.fflate){ await new Promise((ok,ng)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/fflate@0.8.2/umd/index.js'; sc.onload=ok; sc.onerror=ng; document.head.appendChild(sc); }); }
  return new TextDecoder().decode(window.fflate.gunzipSync(new Uint8Array(buf))); }
async function loadEnc(){ if(!GATED) return; try{ const r=await fetch(`data/enc.json?v=${BUILT}`,{cache:'no-store'}); if(r.ok) ENC=await r.json(); }catch(e){} }
const locked=d=>!!(ENC&&ENC.days&&ENC.days[d]&&!OPEN[d]);
async function openWith(pw){       /* その合い言葉で開ける日を全部開く。戻り: 開けた日 */
  const got=[]; if(!ENC||!ENC.days||!pw) return got; const k=await kekOf(pw);
  for(const [d,x] of Object.entries(ENC.days)){
    for(const w of (x.w||[])){
      try{ const raw=await dec(k,w.iv,w.k);
        if(!OPEN[d]){ const ck=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']); OPEN[d]=JSON.parse(await unz(await dec(ck,x.iv,x.ct),x.z)); }
        got.push(d); break; }catch(e){} } }
  return got; }
function mergePaid(j,d){ const m=OPEN[d]; if(!m||!j) return; (j.races||[]).forEach(r=>{ const pr=m[r.rid]; if(!pr) return; (r.runners||[]).forEach(h=>{ const x=pr[String(h.uno)]; if(x) Object.assign(h,x); }); }); }
async function tryUnlock(pw,remember){
  try{ pw=(pw||'').trim(); if(!pw) return false; const got=await openWith(pw); if(!got.length) return false;
    if(remember){ const l=(ls.get(LSK,[])||[]).filter(x=>x!==pw); l.push(pw); ls.set(LSK,l); }
    Object.keys(CACHE).forEach(d=>mergePaid(CACHE[d],d)); if(DATA) mergePaid(DATA,DAY);
    renderAll(); return true; }catch(e){ return false; } }
async function unlockFrom(inp){ const box=inp.closest('.lock'); const ok=await tryUnlock(inp.value,true); if(!ok&&box){ box.querySelector('.er').style.display='block'; } }
function lockBox(d,msg){ const A=NOTE_URL?`<div class="buy"><a href="${esc(NOTE_URL)}" target="_blank" rel="noopener">1日券を買う</a></div>`:'';
  return `<div class="lock">${ico('lock')}<p>${esc(msg||`この日の合い言葉を入れると、${dayLab(d)}の全レースの勝率と期待値が開きます。`)}</p><div class="pw"><input type="password" placeholder="合い言葉" autocomplete="off" inputmode="numeric" onkeydown="if(event.key==='Enter')unlockFrom(this)"><button type="button" onclick="unlockFrom(this.previousElementSibling)">開く</button></div><div class="er">合い言葉が違います</div><div class="n">合い言葉は開催日ごとです。一度入れればこの端末では開いたままになります。${NOTE_URL?'':'<br>1日券は準備中です。'}</div>${A}</div>`; }

/* ===== オッズを更新（2026-10-30） ===== */
const OUPD={};                                   /* rid → 最後に押した時刻（20秒は押せない） */
const RELAY='https://r.jina.ai/https://nar.netkeiba.com/api/api_get_nar_odds.html?race_id=';
const hhmm=()=>{ const n=new Date(); return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; };
function oddsBtn(r){ const left=Math.max(0,20000-(Date.now()-(OUPD[r.rid]||0))); const y=r.odds_status==='yoso';
  return `<button class="oupdg" id="oupd" type="button"${left>0?' disabled':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>オッズを更新<em>${r.odds_at?(y?'発売前の想定':esc(r.odds_at)+' 時点'):''}</em></button><div class="oupd-n" id="oupdn">${OUPD['n_'+r.rid]||''}</div>`; }
function applyOdds(r,byHid,st,at){
  (r.runners||[]).forEach(h=>{ const x=byHid[String(h.hid)]; if(x&&x.odds>0){ h.odds=x.odds; h.pop=x.pop; } });
  if(st) r.odds_status=st; if(at) r.odds_at=at;
  const live=(r.runners||[]).filter(h=>!h.scr&&h.odds>0&&h.raw!=null);
  if(live.length>=2){                              /* 開いている日: 新しいオッズから勝率を出し直す（AIのずれ raw はそのまま） */
    const S=live.reduce((a,h)=>a+1/h.odds,0); let Q=0;
    live.forEach(h=>{ const m=(1/h.odds)/S; const z=h.raw+Math.log(m/(1-m)); h._q=1/(1+Math.exp(-z)); h.mkt=+m.toFixed(4); Q+=h._q; });
    live.forEach(h=>{ h.p=+(h._q/Q).toFixed(4); h.ev=+(h.p*h.odds).toFixed(2); delete h._q; });
  }
}
async function updOdds(r){ const b=$('#oupd'); if(!b||b.disabled) return; b.disabled=true; b.innerHTML='更新中…'; OUPD[r.rid]=Date.now(); OUPD['n_'+r.rid]='';
  let ok=false;
  try{ const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),10000);
    const res=await fetch(RELAY+encodeURIComponent(r.rid)+'%26type%3D1%26action%3Dinit',{headers:{'x-return-format':'text'},signal:ac.signal}); clearTimeout(tm);
    const t=await res.text(); const j=JSON.parse(t.slice(t.indexOf('{'))); const kn=(j.ary_odds||{}).KettoNum||{};
    if(j.status==='OK'&&Object.keys(kn).length){ const m={}; Object.entries(kn).forEach(([h,v])=>{ m[h]={odds:+v.Odds,pop:+v.Ninki}; }); applyOdds(r,m,j.odds_status,hhmm()); ok=true; }
  }catch(e){}
  if(!ok){ try{ const res=await fetch(`data/${DAY}.json?t=${Date.now()}`,{cache:'no-store'}); const j=await res.json(); const x=(j.races||[]).find(q=>q.rid===r.rid);
      if(x){ const m={}; (x.runners||[]).forEach(h=>{ if(h.odds>0) m[String(h.hid)]={odds:h.odds,pop:h.pop}; }); applyOdds(r,m,x.odds_status,x.odds_at); OUPD['n_'+r.rid]='サイトの値で更新'; } }catch(e){} }
  renderRacePage(r); setTimeout(()=>{ const bb=$('#oupd'); if(bb&&cur.race===r.rid) bb.disabled=false; },20000); }
/* ===== 目次 ===== */
const lxMin=r=>{ const m=(r.time||'').match(/(\d+):(\d+)/); return m?(+m[1]*60+ +m[2]):9999; };
const lxOk=r=>r.runners&&r.runners.length>=2;
const lxFin=r=>!!(r.result&&r.result.order&&r.result.order.length);
function lxDay(){ const now=new Date(), t=ymd(now); return {today:DAY===t, past:DAY<t, hm:now.getHours()*60+now.getMinutes()}; }
function lxGone(r,X){ return lxFin(r)||(X.today&&lxMin(r)<X.hm)||X.past; }
function hasGold(r){ return (r.runners||[]).some(h=>!h.scr&&h.ev!=null&&h.ev>=1.0); }
/* レースのラベル（UMAMI と同じ決め方）: 期待値0.9以上の馬の勝率の合計 → 0.25以上=本線、0.10以上=相手、それ未満=穴、該当なし=なし */
function raceLabel(r){ const hs=(r.runners||[]).filter(h=>!h.scr&&h.odds>0&&h.p>0); if(!hs.length) return null;
  let sum=0,n1=0,n9=0; hs.forEach(h=>{ const v=h.ev!=null?h.ev:Math.round(h.p*h.odds*100)/100; if(v>=0.9){ sum+=h.p; if(v>=1) n1++; else n9++; } });
  return {k:(n1+n9)===0?'none':(sum>=0.25?'main':(sum>=0.10?'mid':'ana')), sum, n1, n9}; }
const ULAB={main:'本線',mid:'相手',ana:'穴',none:'なし'};
const alertN=r=>(r.runners||[]).filter(h=>!h.scr&&h.alert>=1).length;
function renderRaces(){ const el=$('#s-races'); const X=lxDay(); const LK=locked(DAY);
  const dsel= DAYS.length<2 ? '' : `<div class="seg dsel sm">${DAYS.slice().sort().slice(-4).map(d=>`<button data-d="${d}" class="${d===DAY?'on':''}">${dayLab(d)}</button>`).join('')}</div>`;
  const byV=VENUES.map(v=>(DATA.races||[]).filter(r=>r.venue_name===v).sort((a,b)=>a.R-b.R));
  const nxs=X.past?[]:byV.map(rs=>rs.find(r=>lxOk(r)&&!lxGone(r,X))).filter(Boolean); const NX=new Set(nxs.map(r=>r.rid));
  const maxR=Math.max(0,...byV.map(rs=>rs.length));
  const cell=(r,rs)=>{ if(!r) return '<div class="lxt-q empty"></div>';
    const ok=lxOk(r), f=lxFin(r), w=!f&&lxGone(r,X), isn=NX.has(r.rid);
    const c=['lxt-q',!ok?'dis':f?'fin':w?'wait':'up',isn?'nx':'',r===rs[0]?'first':'',r===rs[rs.length-1]?'last':''].filter(Boolean).join(' ');
    let mk=''; if(ok&&!f&&!w&&!LK){ const L=raceLabel(r); if(L&&L.k!=='none') mk+=`<span class="lb u-${L.k}"></span>`; const a=alertN(r); if(a) mk+=`<span class="ac">${a}</span>`; }
    return `<button type="button" class="${c}" data-rid="${r.rid}"${ok?'':' disabled'}><span class="h"><b>${r.R}</b><i>${esc(r.time||'')}</i><em>${r.surface==='芝'?'芝':'ダ'}</em></span><span class="n">${esc(r.name)}</span>${ok&&w?'<span class="w">結果待ち</span>':''}${mk}</button>`; };
  let rows=''; for(let i=0;i<maxR;i++) rows+=byV.map(rs=>cell(rs[i],rs)).join('');
  const heads=VENUES.map((v,i)=>{ const rs=byV[i], fin=rs.filter(r=>lxFin(r)).length; const r0=rs.find(r=>r.weather||r.going)||{}; const wx=[r0.weather,r0.going].filter(Boolean).join('・');
    return `<div class="lxt-vh">${esc(v)}<span>${X.past?'終了':`${fin}/${rs.length}`}</span>${wx?`<span class="wx">${esc(wx)}</span>`:''}</div>`; }).join('');
  const lg=`<div class="lxt-lg"><span><i class="d f"></i>終了</span><span><i class="d x"></i>次のレース</span>${LK?'':`<span><i class="lb u-main"></i>本線</span><span><i class="lb u-mid"></i>相手</span><span><i class="lb u-ana"></i>穴</span><span><i class="ac"></i>人気馬の注意</span>`}</div>`;
  const map=VENUES.length?`<div class="lxh"><b>${X.today?'きょうのレース':X.past?'全レース（終了）':'全レース'}</b><span>押すとそのレースへ</span></div><div class="lxt" style="grid-template-columns:repeat(${VENUES.length},minmax(0,1fr))">${heads}${rows}</div>${lg}`:'<div class="pend">この日のレースはまだありません</div>';
  el.innerHTML=`<h2>${ico('flag')}レース</h2>${dsel}${map}`;
  el.querySelectorAll('.dsel button').forEach(b=>b.onclick=async()=>{ await setDay(b.dataset.d); ls.set('sunao_day',DAY); renderAll(); showTab('races'); });
  el.querySelectorAll('[data-rid]').forEach(b=>{ if(b.disabled) return; b.onclick=()=>openRace(b.dataset.rid); });
}
/* ===== レース ===== */
function openRace(rid){ cur.race=rid; const r=byRid[rid]; if(!r) return; renderRacePage(r); showTab('race'); }
const evCls=h=>h.scr||h.ev==null?'':h.ev>=1.0?'e2':h.ev>=0.9?'e1':'';
const pct=p=>p==null?'—':(p*100).toFixed(1);
const fmtWt=h=>h.weight?`${h.weight}${h.wdiff!=null?`(${h.wdiff>0?'+':''}${h.wdiff})`:''}`:'';
function favRows(h){ const f=h.fav||{}; const L={j:'騎手',t:'厩舎',c:'組み合わせ'}; const rows=Object.keys(L).filter(k=>f[k]&&f[k][0]).map(k=>{ const [n,e,a]=f[k]; const ok=a>=e; return `<div><b>${L[k]}</b><span class="${ok?'ok':''}">100回中 見込み${Math.round(e)}→実際<em>${Math.round(a)}</em>（${n}回）</span></div>`; });
  if(!rows.length) return ''; return `<h4>人気馬だったときの実績</h4><div class="fv">${rows.join('')}<p>単勝5倍以下で乗ったときに、同じ人気の馬が普通どれだけ勝つかと比べたもの。回数が少ないうちは幅があります。</p></div>`; }
const RUNC={'逃げ':'r1','先行':'r2','差し':'r3','追込':'r4'};
const runChip=h=>h.run&&RUNC[h.run]?`<span class="rn ${RUNC[h.run]}">${h.run}</span>`:'';
const CHC=c=>/↑|前走勝ち|速さ/.test(c)?(/速さ/.test(c)?'sp':'up'):/↓|降級|大幅減|休み明け/.test(c)?'dn':'';
function chips(h,max){ const C=(h.chips||[]).filter(Boolean); if(!C.length) return ''; const m=max||C.length; const vis=C.slice(0,m), rest=C.length-vis.length;
  return `<div class="chs">${vis.map(c=>`<span class="ch ${CHC(c)}">${esc(c)}</span>`).join('')}${rest>0?`<span class="ch">+${rest}</span>`:''}</div>`; }
function jtRows(h){ const j=h.jt||{}; const f=(a,lab)=>a&&a[2]?`<div><b>${lab}</b><span>勝率${a[0]==null?'—':a[0].toFixed(0)}% 3着内${a[1]==null?'—':a[1].toFixed(0)}%<small>（${(a[2]||0).toLocaleString()}回）</small></span></div>`:'';
  const rows=f(j.j,'騎手')+f(j.t,'調教師'); return rows?`<h4>騎手と調教師のこれまで</h4><div class="jtl">${rows}</div>`:''; }
function pastRows(h){ const P=h.past||[]; if(!P.length) return '<h4>近走</h4><p class="note" style="margin-top:0">まだ記録がありません。</p>';
  const l3=p=>`${p.l3!=null?p.l3:'—'}${p.l3r>=1&&p.l3r<=3?`<span class="l3b k${p.l3r}">${p.l3r}</span>`:''}`;
  return `<h4>近5走</h4><div class="ptw"><table class="pt"><tr><th class="l">日付</th><th class="l">場</th><th>距離</th><th>着</th><th>人気</th><th>速さ</th><th>上り</th><th class="l">通過</th><th class="l">騎手</th><th>体重</th><th class="l">レース</th></tr>${P.map(p=>`<tr><td class="l">${esc(p.d||'')}</td><td class="l">${esc(p.v||'')}</td><td>${esc(p.surf||'')}${p.dist||''}${p.go?'<small style="color:var(--mute)">'+esc(p.go)+'</small>':''}</td><td class="${p.fin===1?'w1':''}"><b>${p.fin==null?'—':p.fin}</b>/${p.n||''}</td><td>${p.pop||'—'}</td><td>${p.sp!=null?p.sp.toFixed(0):'—'}</td><td>${l3(p)}</td><td class="l">${esc(p.pos||'')}</td><td class="l">${esc(p.j||'')}</td><td>${p.wt||''}</td><td class="nmr">${esc(p.nm||'')}</td></tr>`).join('')}</table></div>`; }
function horseCard(h){ return `<div class="hc">${(h.run||(h.chips||[]).length)?`<div class="chs">${runChip(h)}${(h.chips||[]).map(c=>`<span class="ch ${CHC(c)}">${esc(c)}</span>`).join('')}</div>`:''}${pastRows(h)}${jtRows(h)}${favRows(h)}</div>`; }

/* 帯の会場タブとレース番号タブ（UMAMI と同じ部品。会場を押すとその会場の番号に入れ替わり、番号を押すとそのレースへ） */
function rselBody(r,v){ const X=lxDay(); const rs=(DATA.races||[]).filter(x=>x.venue_name===v).sort((a,b)=>a.R-b.R);
  const nx=X.past?null:(rs.find(x=>lxOk(x)&&!lxGone(x,X))||{}).rid;

    <div class="rs-r">${rs.map(x=>{ const ok=lxOk(x); const c=[x.surface==='芝'?'turf':'',x.rid===r.rid?'ro':'',x.rid===nx&&x.rid!==r.rid?'nx':'',ok&&!X.past&&lxGone(x,X)?'gone':''].filter(Boolean).join(' ');

  ${H(2,'coin','期待値と金の2段','<b>期待値＝勝率×単勝オッズ</b>。100円の単勝を買ったとき、平均していくら戻るかの倍率です。<span class="k g">1.00以上</span> は買い続けると元が取れる見込みの馬、<span class="k g2">0.90以上</span> は惜しい馬。',
    `<li>全部の馬を100円ずつ買うと、100円あたり70円ほどしか戻りません。期待値の高い馬だけに絞るのが、すなおの使い方です。</li><li>見立て＝期待値が0.90以上の馬を勝率順に並べたもの。いなければ勝率の上位3頭。全頭＝全馬を勝率順に。</li><li>期待値はオッズで動きます。発売前は「想定」のオッズなので目安。発走が近づくほど本当の値に近づきます。</li>`)}
  ${H(3,'ticket','買い目','予算と配分を選ぶと、期待値0.90以上の馬の単勝に100円単位で配った表が出ます。該当する馬がいないレースは「見送り」。',
    `<li>「勝率に比例」は勝ちやすい馬に多く、「均等」は同じ額ずつ。予算と配分はこの端末に残ります。</li><li>「的中時」はその馬が勝ったときに戻る額（いまのオッズ）。オッズを更新すると配分も出し直します。</li><li>買い目は材料です。買うかどうか、いくら買うかはご自身で決めてください。</li>`)}
  ${H(4,'flag','レースのラベル','期待値が0.90以上の馬の勝率を足して、<b>本線</b>（100レース中25勝分以上）・<b>相手</b>（10勝分以上）・<b>穴</b>（それ未満）の3つに分けています。',
    `<li>本線は「金の馬が勝ちやすいレース」。穴は「金の馬はいるが勝率は低い」ので、当たれば大きい代わりに外れやすいレースです。</li><li>目次の色の丸と、レースページの「勝率と期待値」の札に出ます。</li>`)}
  ${H(5,'alert','人気馬の注意','単勝5倍以下の人気馬で、<b>すなおの勝率が人気を下回る</b>か、<b>騎手・厩舎・その組み合わせ</b>が人気馬だったときに見込みより来ていない馬に札が付きます。',
    `<li>「100回中 見込み24→実際15（65回）」は、同じ人気の馬が普通どれだけ勝つかと比べた数です。回数が少ないうちは偶然の幅があります。</li><li>「やや」と「人気の割に」の2段。人気馬を軸にするときの、念のための確認に。</li><li>レースページの「人気馬の注意」の章に、該当する馬だけをまとめています。</li>`)}
  ${H(6,'run','脚質と札','出馬表の馬名の横に <span class="k rn r1">逃げ</span><span class="k rn r2">先行</span><span class="k rn r3">差し</span><span class="k rn r4">追込</span> の脚質と、休み明け・乗り替わり・距離の変更などの要素の札が付きます。',
    `<li>脚質は近5走で最初のコーナーをどの位置で回ったかから。逃げ・先行が多いレースは前が苦しくなりやすい、といった見方に。</li><li>乗替↑は前の騎手より勝率の高い騎手に替わった馬、乗替↓はその逆。速さ1位は近5走のいちばん速い走りがレースで1位の馬。</li><li>馬を押すと近5走の表が開き、速さ（大きいほど速い）、上りの順位（1〜3位は札）、通過順も見られます。</li>`)}
  ${H(7,'clock','オッズを更新','「オッズを更新」を押すと、その時点の単勝オッズを取り直し、勝率と期待値も出し直します。押したあと20秒は押せません。',
    `<li>何もしなくても5分ごとに新しい値に入れ替わります。ページの上に更新した時刻が出ます。</li><li>取消になった馬は薄く表示し、残りの馬で勝率を配り直します。</li>`)}
  ${H(8,'key','合い言葉（1日券）','勝率・期待値・人気馬の注意は、<b>開催日ごとの合い言葉</b>で開きます。一度入れればこの端末では開いたまま。終わった日は誰でも見られます。',
    `<li>出馬表・オッズ・近5走・結果・記録は、合い言葉なしで見られます。</li><li>合い言葉は「会員」のタブか、レースページの箱に入れます。</li>`)}
  ${H(9,'chart','記録','出した勝率の帯ごとに「100頭中 見込み何頭→実際何頭」を、日ごとに積んでいます。期待値が金だった馬を単勝100円ずつ買った成績も。',
    `<li>判定は発走1分前までの最後の勝率とオッズ、払い戻しは確定の値です。</li>`)}
  <div class="note">すなおは予想を売るサービスではなく、判断の材料を出すサービスです。馬券の購入は自己責任でお願いします。</div>
</div>`; }
function renderAll(){ renderHeader(); renderRaces(); renderRecord(); renderMem(); renderHowto(); if(cur.race&&byRid[cur.race]) renderRacePage(byRid[cur.race]); }
async function main(){ if(!DAYS.length){ $('#hd').innerHTML='<div class="wm"><div><span class="kana">すなお</span><small class="en">SUNAO</small></div></div>'; $('#s-races').innerHTML='<div class="pend">データがまだありません</div>'; showTab('races'); return; }
  await loadEnc(); for(const pw of (ls.get(LSK,[])||[])){ try{ await openWith(pw); }catch(e){} }
  await setDay(pickDay()); renderAll();
  const q=new URLSearchParams(location.search).get('r'); let k=ls.get('sunao_tab','races'); if(q&&byRid[q]){ openRace(q); } else { if(k==='race') k='races'; showTab(k); }
  document.querySelectorAll('.nav button[data-k]').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k==='up'){ window.scrollTo({top:0,behavior:'smooth'}); return; } if(k==='list'){ showTab('races'); return; } showTab(k); });
  let lastY=window.scrollY; window.addEventListener('scroll',()=>{ const y=window.scrollY; const nv=$('.nav'); if(tab==='race'){ nv.classList.toggle('hid',y>lastY+6&&y>120); if(y<lastY-6) nv.classList.remove('hid'); } else nv.classList.remove('hid'); lastY=y; const rs=$('#rsel'); if(rs) rs.classList.toggle('stuck',y>40); },{passive:true});
  setInterval(async()=>{ try{ const r=await fetch(`data/${DAY}.json?t=${Date.now()}`,{cache:'no-store'}); const j=await r.json(); if(j.built!==DATA.built){ CACHE[DAY]=j; if(GATED){ try{ const e=await fetch(`data/enc.json?t=${Date.now()}`,{cache:'no-store'}); if(e.ok){ ENC=await e.json(); OPEN={}; for(const pw of (ls.get(LSK,[])||[])){ try{ await openWith(pw); }catch(x){} } } }catch(x){} } await setDay(DAY); const y=window.scrollY; renderAll(); window.scrollTo(0,y); } }catch(e){} },300000);   /* 5分ごとに新しいデータがあれば描き直す */
}
main();
</script>
